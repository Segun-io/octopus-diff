# octopus-diff CI. Committed for when the repository gets a remote; it has never been pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependency build scripts are approved/denied in pnpm-workspace.yaml (`allowBuilds`).
  PNPM_INSTALL_FLAGS: --frozen-lockfile

jobs:
  check:
    name: lint · typecheck · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: git --version
      - run: pnpm install $PNPM_INSTALL_FLAGS
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build # before tests: the CLI integration test runs the built bin
      - run: pnpm test
      - name: CLI smoke test
        run: |
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js doctor --state-dir "$RUNNER_TEMP/od-state" --config-dir "$RUNNER_TEMP/od-config"

  # FSEvents, APFS (no non-UTF-8 file names) and /var -> /private/var behave differently from
  # Linux; the unit tests cover the watcher against the real backend (DECISIONS #164).
  test-macos:
    name: test (macOS, Node 26)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: git --version
      - run: pnpm install $PNPM_INSTALL_FLAGS
      - run: pnpm build # before tests: the CLI integration test runs the built bin
      # One package at a time: git spawns are slower on macOS, and packages running side by side
      # (each vitest using every core) push git-heavy tests past their timeouts.
      - run: pnpm -r --workspace-concurrency=1 run test && pnpm run test:scripts

  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install $PNPM_INSTALL_FLAGS
      - run: pnpm build
      - name: Install Chromium and its system dependencies
        run: pnpm --filter @octopus-diff/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # About 10 s: the web render benchmark's waits (list, viewer, J, live refresh) against its own
      # mock with the large dataset, fewer iterations. Structural checks only, no timing budget (#68).
      - name: Web perf script smoke
        run: pnpm --filter @octopus-diff/web perf:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: package (tarball, not published)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install $PNPM_INSTALL_FLAGS
      - run: pnpm build
      - run: pnpm --filter octopus-diff run pack:tarball
      - name: Install the tarball in an empty directory and run it
        run: |
          dir="$RUNNER_TEMP/od-pack"
          mkdir -p "$dir"
          cp apps/cli/.pack/octopus-diff-*.tgz "$dir/"
          cd "$dir"
          echo '{ "name": "od-pack-test", "private": true }' > package.json
          npm install --no-audit --no-fund ./octopus-diff-*.tgz
          ./node_modules/.bin/octopus-diff --version
          ./node_modules/.bin/octopus-diff doctor --state-dir "$dir/state" --config-dir "$dir/config"
          ./node_modules/.bin/octopus-diff doctor --json --state-dir "$dir/state" --config-dir "$dir/config" | node -e 'const c = JSON.parse(require("node:fs").readFileSync(0, "utf8")).checks.find((c) => c.id === "git-helper"); if (c?.status !== "ok") { console.error("doctor: the git helper is not on", c); process.exit(1); }'
          # A diff through the installed daemon and its spawn helper; then SIGKILL: no orphans (#45).
          node "$GITHUB_WORKSPACE/apps/cli/scripts/smoke-tarball.mjs" "$dir"
